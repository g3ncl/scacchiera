[project]
name = "smart-chessboard-hardware"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "build123d==0.11.1",
    "skidl==2.2.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["hardware/tests"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["hardware"]
exclude = ["hardware/(pcb|cad)/generated"]

[[tool.mypy.overrides]]
module = ["skidl", "skidl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pcbnew"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
