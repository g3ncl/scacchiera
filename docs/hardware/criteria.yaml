# Numeric acceptance criteria used by automated verification. Every entry records
# units, conditions, evidence, and deliberate margin. Requirement coverage lives
# in docs/verification/traceability.yaml.
version: 1

criteria:
  GAME-BOARD-FILES:
    description: Number of files and ranks in the chessboard grid.
    requirement_ids: [PRINCIPLE-003]
    unit: count
    limits: {exact: 8}
    evidence: {class: Derived, source: docs/functional/overview.md, locator: Principles}
    operating_conditions: Game model, sensing map, UI, and generated board geometry.
    margin: Exact discrete count; no tolerance applies.
    test_ids: [TEST-GAME-RULES-001, TEST-PHY-GRID-001]

  GAME-BOARD-SQUARES:
    description: Total number of typed physical squares.
    requirement_ids: [PRINCIPLE-003]
    unit: count
    limits: {exact: 64}
    evidence: {class: Derived, source: docs/functional/overview.md, locator: Principles}
    operating_conditions: Game model, sensing map, UI, and generated board geometry.
    margin: Eight files multiplied by eight ranks gives exactly 64 squares.
    test_ids: [TEST-GAME-RULES-001, TEST-PHY-GRID-001]

  GAME-STANDARD-PIECES:
    description: Number of standard pieces provisioned from their starting squares.
    requirement_ids: [GAME-PROVISION-002]
    unit: count
    limits: {exact: 32}
    evidence: {class: Derived, source: docs/functional/gameplay.md, locator: Piece provisioning}
    operating_conditions: New-set provisioning before spare promotion pieces.
    margin: Exact standard chess-set count; no tolerance applies.
    test_ids: [TEST-GAME-PROVISION-002]

  POWER-RUNTIME-MINIMUM:
    description: Minimum cordless duration under the representative clocked-game power profile.
    requirement_ids: [POWER-RUNTIME-001]
    unit: hour
    limits: {minimum: 10.0}
    evidence: {class: Derived, source: docs/functional/power.md, locator: Cordless runtime}
    operating_conditions: Full qualified battery at 20 to 25 degrees Celsius, both clocks displayed, browser connected, required sensing cadence, and event-only light-bar use.
    margin: V3 must predict at least 11 hours so capacity aging and conversion uncertainty do not consume the ten-hour product requirement; V8 measures the exact profile.
    test_ids: [TEST-POWER-RUNTIME-001, TEST-V8-RUNTIME-001]

  POWER-CHARGE-10-80:
    description: Maximum time to charge from 10 to 80 percent state of charge.
    requirement_ids: [POWER-CHARGE-001]
    unit: minute
    limits: {maximum: 240.0}
    evidence: {class: Derived, source: docs/functional/power.md, locator: USB-C charging}
    operating_conditions: Idle board, any power module meeting the interface in docs/hardware/power-module-interface.md with a 5 Ah cell, compliant 5 V 2 A USB source and cable, and cell temperature from 20 to 25 degrees Celsius.
    margin: A 1 A constant-current phase supplies 70 percent of a 5 Ah cell in 210 minutes, leaving 30 minutes for control transitions and the module's own charge profile before V8 measurement.
    test_ids: [TEST-POWER-CHARGE-001, TEST-V8-CHARGE-001]

  POWER-CHARGE-10-FULL:
    description: Maximum time from 10 percent state of charge to normal full-charge termination.
    requirement_ids: [POWER-CHARGE-002]
    unit: minute
    limits: {maximum: 360.0}
    evidence: {class: Derived, source: docs/functional/power.md, locator: USB-C charging}
    operating_conditions: Idle board, any power module meeting the interface in docs/hardware/power-module-interface.md with a 5 Ah cell, compliant 5 V 2 A USB source and cable, and cell temperature from 20 to 25 degrees Celsius.
    margin: The limit leaves 120 minutes beyond the ideal 210-minute constant-current interval for the constant-voltage taper, which does not scale down with charge current; V8 measures termination time.
    test_ids: [TEST-POWER-CHARGE-002, TEST-V8-CHARGE-001]

  POWER-CHARGE-TEMPERATURE-MIN:
    description: Lowest cell temperature at which charging may proceed.
    requirement_ids: [POWER-SAFETY-002]
    unit: degC
    limits: {minimum: 0.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/PISUGAR3_PLUS_safety.md, locator: "Usage Precautions: Temperature Limits"}
    operating_conditions: Independent temperature sensor bonded to the fitted cell and charge interlock enabled.
    margin: Charging is inhibited below the published zero-degree operating boundary rather than extrapolated. The source is a candidate cell's safety document, filed while that module was still bound; the fitted cell's own document must confirm or tighten this bound when one is chosen, and the gate's simulated 2.17 degree worst case leaves room for a tighter limit.
    test_ids: [TEST-POWER-SAFETY-002, TEST-V8-CHARGE-TEMPERATURE-001]

  POWER-CHARGE-TEMPERATURE-MAX:
    description: Highest cell temperature at which full-rate charging may proceed.
    requirement_ids: [POWER-SAFETY-002]
    unit: degC
    limits: {maximum: 40.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/PISUGAR3_PLUS_safety.md, locator: "Usage Precautions: Temperature Limits"}
    operating_conditions: Independent temperature sensor bonded to the fitted cell and charge interlock enabled.
    margin: Charging is inhibited at the published 40-degree operating boundary rather than relying on any module's charger-chip temperature register as a proxy for cell temperature. The source is a candidate cell's safety document, filed while that module was still bound; the fitted cell's own document must confirm or tighten this bound when one is chosen, and the gate's simulated 36.43 degree worst case leaves room for a tighter limit.
    test_ids: [TEST-POWER-SAFETY-002, TEST-V8-CHARGE-TEMPERATURE-001]

  PHY-SQUARE-PITCH:
    description: Nominal center-to-center pitch of adjacent squares.
    requirement_ids: [PHY-GEO-001]
    unit: mm
    limits: {nominal: 35.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Fixed geometry: Square pitch"}
    operating_conditions: Generated nominal CAD geometry before manufacturing variation.
    margin: The 0.10 mm generation tolerance detects parameter drift; fabrication tolerance is checked at V7.
    test_ids: [TEST-PHY-GEO-001]

  PHY-PLAY-WIDTH:
    description: Nominal width and depth of the square playing area.
    requirement_ids: [PHY-GEO-002]
    unit: mm
    limits: {nominal: 280.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Fixed geometry: Play area"}
    operating_conditions: Generated nominal CAD geometry before manufacturing variation.
    margin: Eight 35.0 mm pitches total 280.0 mm; 0.10 mm detects generator drift.
    test_ids: [TEST-PHY-GEO-002]

  PHY-SIDE-RAIL-WIDTH:
    description: Nominal width of each side rail.
    requirement_ids: [PHY-GEO-003]
    unit: mm
    limits: {nominal: 15.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Fixed geometry: Side rails"}
    operating_conditions: Generated nominal CAD geometry before manufacturing variation.
    margin: The 0.10 mm generation tolerance detects a wrong parameter while preserving the nominal dimension.
    test_ids: [TEST-PHY-GEO-003]

  PHY-PLAYER-RAIL-WIDTH:
    description: Nominal width of each player rail.
    requirement_ids: [PHY-GEO-004]
    unit: mm
    limits: {nominal: 50.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Fixed geometry: Player rails"}
    operating_conditions: Generated nominal CAD geometry before manufacturing variation.
    margin: The 0.10 mm generation tolerance detects a wrong parameter while preserving the nominal dimension.
    test_ids: [TEST-PHY-GEO-004]

  PHY-OVERALL-WIDTH:
    description: Nominal overall board width.
    requirement_ids: [PHY-GEO-005]
    unit: mm
    limits: {nominal: 310.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Fixed geometry: Overall board"}
    operating_conditions: Generated nominal CAD geometry before manufacturing variation.
    margin: The play area plus both side rails derives 310 mm; 0.10 mm detects parameter drift.
    test_ids: [TEST-PHY-GEO-005]

  PHY-OVERALL-DEPTH:
    description: Nominal overall board depth.
    requirement_ids: [PHY-GEO-005]
    unit: mm
    limits: {nominal: 380.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Fixed geometry: Overall board"}
    operating_conditions: Generated nominal CAD geometry before manufacturing variation.
    margin: The play area plus both player rails derives 380 mm; 0.10 mm detects parameter drift.
    test_ids: [TEST-PHY-GEO-005]

  PHY-BODY-HEIGHT:
    description: Target body height before feet.
    requirement_ids: [PHY-GEO-006]
    unit: mm
    limits: {target: 32.0, maximum: 32.0}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Fixed geometry: Body height before feet"}
    operating_conditions: Closed generated enclosure excluding removable feet.
    margin: The target is a hard maximum; component and manufacturing margins must fit below it at V7.
    test_ids: [TEST-PHY-GEO-006]

  PHY-TOP-STACK:
    description: Maximum carrier, adhesive, and veneer stack thickness.
    requirement_ids: [PHY-TOP-002]
    unit: mm
    limits: {maximum: 1.75}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Continuous top surface: thickness budget"}
    operating_conditions: Finished top stack at its thickest measured point.
    margin: The V7 nominal and tolerance stack must remain below the product maximum.
    test_ids: [TEST-PHY-TOP-002]

  PHY-CARRIER-THICKNESS:
    description: Nominal structural carrier thickness.
    requirement_ids: [PHY-TOP-004]
    unit: mm
    limits: {nominal: 1.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Continuous top surface: carrier"}
    operating_conditions: Purchased G10 or FR4 carrier before adhesive and veneer are applied.
    margin: The 0.10 mm incoming tolerance leaves at least 0.65 mm of the total stack budget for adhesive and veneer.
    test_ids: [TEST-MECH-TOP-004, TEST-V8-TOP-STACK-001]

  PHY-TAG-DISTANCE:
    description: Maximum distance from a resting tag to the sensing plane.
    requirement_ids: [PHY-RF-001]
    unit: mm
    limits: {maximum: 3.0}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Read budget: complete distance"}
    operating_conditions: Worst-case piece, felt, veneer, adhesive, carrier, air gap, and PCB stack.
    margin: The mechanical nominal must remain below 3.0 mm by its complete worst-case tolerance stack.
    test_ids: [TEST-PHY-RF-001]

  PHY-CONDUCTOR-CLEARANCE:
    description: Minimum conductor distance behind the sensing plane before RF measurement.
    requirement_ids: [PHY-RF-002]
    unit: mm
    limits: {minimum: 10.0}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: "Read budget: conductor keepout"}
    operating_conditions: Uncalibrated design before an assembled V8 RF check proves a smaller distance.
    margin: No reduction is allowed without measured V8 evidence.
    test_ids: [TEST-PHY-RF-002]

  PHY-TAG-RECESS-DIAMETER:
    description: Nominal centered NFC tag recess diameter in each piece.
    requirement_ids: [PHY-PIECE-001]
    unit: mm
    limits: {nominal: 22.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/physical.md, locator: Pieces}
    operating_conditions: Generated nominal piece geometry before manufacturing variation.
    margin: The generation tolerance detects a wrong recess while V7 adds clearance from the selected tag drawing.
    test_ids: [TEST-MECH-PIECE-001]

  IF-DISPLAY-COUNT:
    description: Number of player display modules.
    requirement_ids: [IF-DISPLAY-001]
    unit: count
    limits: {exact: 2}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: Displays}
    operating_conditions: Complete assembled product.
    margin: Exact one-per-player count; no tolerance applies.
    test_ids: [TEST-IF-DISPLAY-001]

  IF-DISPLAY-WIDTH:
    description: Nominal display module width.
    requirement_ids: [IF-DISPLAY-001]
    unit: mm
    limits: {nominal: 100.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: "Displays: specified module envelope"}
    operating_conditions: Maximum display envelope used by CAD.
    margin: CAD must reserve the datasheet maximum envelope plus V7 assembly clearance.
    test_ids: [TEST-IF-DISPLAY-001]

  IF-DISPLAY-HEIGHT:
    description: Nominal display module height.
    requirement_ids: [IF-DISPLAY-001]
    unit: mm
    limits: {nominal: 33.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: "Displays: specified module envelope"}
    operating_conditions: Maximum display envelope used by CAD.
    margin: CAD must reserve the datasheet maximum envelope plus V7 assembly clearance.
    test_ids: [TEST-IF-DISPLAY-001]

  IF-LIGHTBAR-WIDTH:
    description: Nominal light-bar PCB length.
    requirement_ids: [IF-LIGHTBAR-001]
    unit: mm
    limits: {nominal: 120.0, tolerance: 0.01}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: Light bars}
    operating_conditions: Generated routed PCB outline.
    margin: The tolerance admits serialization precision but detects a wrong outline.
    test_ids: [TEST-IF-LIGHTBAR-001]

  IF-LIGHTBAR-ASSEMBLY-COUNT:
    description: Number of complete light-bar assemblies in the product.
    requirement_ids: [IF-LIGHTBAR-001]
    unit: count
    limits: {exact: 2}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: Light bars}
    operating_conditions: Complete assembled product.
    margin: Exact one-per-player count; no tolerance applies.
    test_ids: [TEST-IF-LIGHTBAR-001]

  IF-LIGHTBAR-HEIGHT:
    description: Nominal light-bar PCB height.
    requirement_ids: [IF-LIGHTBAR-001]
    unit: mm
    limits: {nominal: 8.5, tolerance: 0.01}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: Light bars}
    operating_conditions: Generated routed PCB outline.
    margin: The tolerance admits serialization precision but detects a wrong outline.
    test_ids: [TEST-IF-LIGHTBAR-001]

  IF-LIGHTBAR-COUNT:
    description: Fitted addressable LEDs per player light bar.
    requirement_ids: [IF-LIGHTBAR-002]
    unit: count
    limits: {exact: 14}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: Light bars}
    operating_conditions: Functional spec, schematic, layout, simulation, BOM, firmware, and criteria.
    margin: Exact discrete count; no tolerance applies.
    test_ids: [TEST-IF-LIGHTBAR-002]

  IF-DIFFUSER-STANDOFF:
    description: Nominal diffuser standoff derived from half the LED pitch.
    requirement_ids: [IF-LIGHTBAR-003]
    unit: mm
    limits: {nominal: 3.65, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/interface.md, locator: "Light bars: diffuser standoff"}
    operating_conditions: Generated nominal diffuser geometry; V8 verifies perceived continuity.
    margin: Half of 7.30 mm is 3.65 mm; 0.10 mm detects a wrong CAD parameter without claiming optical tolerance.
    test_ids: [TEST-MECH-DIFFUSER-001, TEST-V8-DIFFUSER-001]

  GAME-TIME-SELECT-WINDOW:
    description: Time-control selection window after accepting the start position.
    requirement_ids: [GAME-CLOCK-001]
    unit: s
    limits: {nominal: 10.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/gameplay.md, locator: "Clock and results: selection window"}
    operating_conditions: Monotonic firmware clock under every supported power state.
    margin: One percent is wider than the crystal error and preserves the specified interaction.
    test_ids: [TEST-GAME-CLOCK-001]

  GAME-TIME-SELECT-HOLD:
    description: King hold duration used to choose a time-control preset.
    requirement_ids: [GAME-CLOCK-002]
    unit: s
    limits: {nominal: 3.0, tolerance: 0.20}
    evidence: {class: Derived, source: docs/functional/gameplay.md, locator: "Clock and results: king hold"}
    operating_conditions: Stable typed king position with sensing debounce applied.
    margin: The 200 ms window accommodates one sensing cycle while remaining perceptibly three seconds.
    test_ids: [TEST-GAME-CLOCK-002]

  GAME-RESIGN-HOLD:
    description: King-absence duration that starts resignation or draw confirmation.
    requirement_ids: [GAME-RESULT-003]
    unit: s
    limits: {nominal: 5.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/gameplay.md, locator: "Clock and results: resignation"}
    operating_conditions: Stable complete-board scans while one or both kings are absent.
    margin: Two percent admits scheduler granularity while preventing an early gesture.
    test_ids: [TEST-GAME-RESULT-003]

  GAME-RESULT-COUNTDOWN:
    description: Confirmation countdown after a resignation or draw gesture.
    requirement_ids: [GAME-RESULT-004]
    unit: s
    limits: {nominal: 15.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/gameplay.md, locator: "Clock and results: countdown"}
    operating_conditions: Monotonic firmware clock after accepting the king-absence gesture.
    margin: The tolerance admits scheduler granularity without materially shortening confirmation.
    test_ids: [TEST-GAME-RESULT-004]

  GAME-IDLE-SLEEP:
    description: Idle duration before automatic sleep when sleep is permitted.
    requirement_ids: [GAME-POWER-001]
    unit: min
    limits: {nominal: 20.0, tolerance: 0.25}
    evidence: {class: Derived, source: docs/functional/gameplay.md, locator: Sleep and battery}
    operating_conditions: No game, clients, button activity, or position changes.
    margin: Fifteen seconds accommodates housekeeping while preserving about twenty minutes.
    test_ids: [TEST-GAME-POWER-001]

  GAME-LOW-BATTERY-SHUTDOWN:
    description: Grace period between a critical battery indication and shutdown.
    requirement_ids: [GAME-POWER-003]
    unit: min
    limits: {nominal: 5.0, tolerance: 0.10}
    evidence: {class: Derived, source: docs/functional/gameplay.md, locator: Sleep and battery}
    operating_conditions: Critical battery remains asserted and USB remains absent.
    margin: Six seconds accommodates orderly persistence without materially shortening warning.
    test_ids: [TEST-GAME-POWER-003]

  LB-SUPPLY-DROOP:
    description: Worst 5 V feed drop plus ground rise at any light-bar LED.
    requirement_ids: [IF-LIGHTBAR-002]
    unit: V
    limits: {maximum: 0.10}
    evidence: {class: Derived, source: Vault/Scacchiera/Wiki/sources/t37k3rgb-05c000112u1930-datasheet.md, locator: Datasheet page 6 and layout-derived resistance}
    operating_conditions: All 14 pixels white at 16 mA each, minimum copper thickness, and maximum resistivity.
    margin: Nominal routed droop is 12.46 mV, leaving 87.54 mV.
    test_ids: [TEST-LB-PWR-001]

  MATRIX-CELL-RESONANCE:
    description: Untrimmed selected-cell resonance before loaded-bus interaction.
    requirement_ids: [PHY-RF-001]
    unit: MHz
    limits: {minimum: 12.5, maximum: 15.0}
    evidence: {class: Derived, source: hardware/sim/loop.py, locator: Routed loop geometry and filed component models}
    operating_conditions: Nominal routed loop with one selected switch cell and no tag.
    margin: The DNP trim only adds capacitance; the window reserves adjustment around 13.56 MHz.
    test_ids: [TEST-MATRIX-RF-001]

  MATRIX-BUS-RESONANCE:
    description: Untrimmed selected-cell resonance on the complete 16-cell bus.
    requirement_ids: [PHY-RF-001]
    unit: MHz
    limits: {minimum: 12.5, maximum: 15.0}
    evidence: {class: Derived, source: hardware/sim/matrix_rf.py, locator: Production switch connectivity and routed geometry}
    operating_conditions: One selected and fifteen deselected nominal cells, no tag.
    margin: The DNP trim only adds capacitance; the window reserves adjustment around 13.56 MHz.
    test_ids: [TEST-MATRIX-RF-002]

  MATRIX-OFF-ON-SUPPRESSION:
    description: Current ratio between selected and deselected antenna lines.
    requirement_ids: [PRINCIPLE-001, GAME-FAULT-003]
    unit: dB
    limits: {minimum: 40.0}
    evidence: {class: Derived, source: Vault/Scacchiera/Wiki/sources/matrix-discrete-datasheets.md, locator: PIN diode and MOSFET switching parameters}
    operating_conditions: Carrier frequency with one selected and one nominal deselected cell.
    margin: Exact vendor-model simulation is 65.6 dB, leaving 25.6 dB for corners and extracted geometry.
    test_ids: [TEST-MATRIX-RF-003]

  MATRIX-BIAS-CURRENT:
    description: Forward steering current through a selected PIN-diode cell.
    requirement_ids: [PHY-RF-001]
    unit: mA
    limits: {minimum: 7.0, maximum: 14.0}
    evidence: {class: Derived, source: Vault/Scacchiera/Wiki/sources/matrix-discrete-datasheets.md, locator: BAR64-02V and SDFL2012S100KTF limits}
    operating_conditions: 3.3 V rail across bounded resistor, MOSFET, diode, and choke corners.
    margin: Nominal 10.326 mA is 3.326 mA above the switching floor and 4.674 mA below the published choke rating.
    test_ids: [TEST-MATRIX-BIAS-001]

  MATRIX-OFF-BIAS-CURRENT:
    description: Leakage current in a deselected antenna cell.
    requirement_ids: [PHY-RF-001]
    unit: uA
    limits: {maximum: 10.0}
    evidence: {class: Derived, source: Vault/Scacchiera/Wiki/sources/matrix-discrete-datasheets.md, locator: MOSFET and PIN-diode leakage limits}
    operating_conditions: Deselected cell over V3 supply and temperature corners.
    margin: Ten microamps is three orders below the selected-cell bias floor.
    test_ids: [TEST-MATRIX-BIAS-002]

  HUB-SYSTEM-RESONANCE:
    description: Resonance of the PN5180 transmit path and complete selected matrix bus.
    requirement_ids: [PHY-RF-001]
    unit: MHz
    limits: {minimum: 12.5, maximum: 15.0}
    evidence: {class: Derived, source: hardware/sim/hub_front_end.py, locator: Production connectivity and routed-loop model}
    operating_conditions: Nominal front end with one selected and fifteen deselected cells, no tag.
    margin: The window reserves trim range around 13.56 MHz; V4 replaces the analytical model.
    test_ids: [TEST-HUB-RF-001]

  HUB-COIL-CURRENT-PER-VOLT:
    description: Selected-loop current per volt of PN5180 transmit drive.
    requirement_ids: [PHY-RF-001]
    unit: mA/V
    limits: {minimum: 20.0}
    evidence: {class: Derived, source: hardware/sim/hub_front_end.py, locator: Production connectivity and routed-loop model}
    operating_conditions: Simulated system resonance with one selected line.
    margin: Nominal 60 mA/V is three times the minimum; V4 replaces it with field and receive limits.
    test_ids: [TEST-HUB-RF-002]

  HUB-INTERLOCK-ENABLE-HIGH:
    description: Charge-switch enable level while the cell-temperature gate permits charging.
    requirement_ids: [POWER-SAFETY-002]
    unit: V
    limits: {minimum: 1.5}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP22811AW5-7_C3001660.pdf, locator: "Electrical Characteristics: VIH, EN input logic high voltage, 2.7 to 5.5 V input"}
    operating_conditions: Cell at 22.5 degrees Celsius, every gate tolerance and comparator-error corner, 4.5 to 5.5 V input, worst-case 1 uA enable leakage loading the pull-up.
    margin: A gate that asserts too weakly to enable the switch would inhibit charging permanently rather than dangerously, so this criterion protects function, not safety.
    test_ids: [TEST-HUB-INTERLOCK-ENABLE-001]

  HUB-INTERLOCK-ENABLE-LOW:
    description: Charge-switch enable level while the cell-temperature gate inhibits charging.
    requirement_ids: [POWER-SAFETY-002]
    unit: V
    limits: {maximum: 0.5}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP22811AW5-7_C3001660.pdf, locator: "Electrical Characteristics: VIL, EN input logic low voltage, 2.7 to 5.5 V input"}
    operating_conditions: Cell at minus 15 degrees Celsius, every gate tolerance and comparator-error corner, 4.5 to 5.5 V input.
    margin: The comparator has to pull the enable pin below the switch's guaranteed low level against a 100 kohm pull-up for the inhibit to be real rather than nominal.
    test_ids: [TEST-HUB-INTERLOCK-ENABLE-001]

  HUB-INTERLOCK-FAULT-ENABLE:
    description: Charge-switch enable level with the cell sensor open or short circuited.
    requirement_ids: [POWER-SAFETY-002]
    unit: V
    limits: {maximum: 0.5}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP22811AW5-7_C3001660.pdf, locator: "Electrical Characteristics: VIL, EN input logic low voltage, 2.7 to 5.5 V input"}
    operating_conditions: Sensor replaced by an open circuit and by a short circuit, nominal gate resistors, 4.5 to 5.5 V input.
    margin: A lost sensor must read as a cutoff rather than as a plausible temperature, so both failure directions inhibit charging instead of one.
    test_ids: [TEST-HUB-INTERLOCK-FAULT-001]

  HUB-INTERLOCK-BAND-COLD:
    description: Coldest cell temperature at which the gate must still permit charging in every corner.
    requirement_ids: [POWER-CHARGE-001]
    unit: degC
    limits: {maximum: 20.0}
    evidence: {class: Derived, source: docs/functional/power.md, locator: USB-C charging}
    operating_conditions: Tightest permitted window over every gate tolerance corner and the comparator error direction that narrows it, including sensor accuracy.
    margin: The functional charge times are specified from 20 degrees Celsius upward, so a gate whose cold edge sat above that would fail the charge requirement it exists to protect.
    test_ids: [TEST-HUB-INTERLOCK-BAND-001]

  HUB-INTERLOCK-BAND-HOT:
    description: Hottest cell temperature at which the gate must still permit charging in every corner.
    requirement_ids: [POWER-CHARGE-001]
    unit: degC
    limits: {minimum: 25.0}
    evidence: {class: Derived, source: docs/functional/power.md, locator: USB-C charging}
    operating_conditions: Tightest permitted window over every gate tolerance corner and the comparator error direction that narrows it, including sensor accuracy.
    margin: The functional charge times are specified up to 25 degrees Celsius, and a cell warms while charging, so the hot edge has to clear the stated band rather than sit inside it.
    test_ids: [TEST-HUB-INTERLOCK-BAND-001]

  HUB-LED-RAIL-TRIP-FLOOR:
    description: Guaranteed minimum current limit on the light-bar rail.
    requirement_ids: [IF-LIGHTBAR-002]
    unit: A
    limits: {minimum: 0.5}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/TPS2553DBVR-1_C111738.pdf, locator: "Section 9.5.1, IOS programming: IOSmin = 25230 / R^1.016 with R in kohm, valid 15 k to 232 k"}
    operating_conditions: Both light bars at full white, 4.5 to 5.5 V module output, 39 kohm 1% programming resistor at both tolerance extremes.
    margin: The bars draw 448 mA, so the limiter must not trip on a legitimate bright cue. The data sheet's 609 mA minimum at 39 kohm is 1.36 times that load, and TI's transient model clamps at 657 mA in the worst simulated corner.
    test_ids: [TEST-HUB-LED-RAIL-001]

  HUB-LED-RAIL-FAULT-CEILING:
    description: Maximum current the light-bar rail can deliver into a short circuit.
    requirement_ids: [IF-LIGHTBAR-002]
    unit: A
    limits: {maximum: 1.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/A1257WR-S-4P_C225127.pdf, locator: "Current rating: 1 A AC, DC"}
    operating_conditions: Output short circuit, 4.5 to 5.5 V module output, 39 kohm 1% programming resistor at both tolerance extremes.
    margin: A shorted bar harness must not exceed the contact rating of the connector carrying it. The data sheet's 734 mA maximum at 39 kohm leaves 27 percent, and TI's transient model clamps at 670 mA in the worst simulated corner.
    test_ids: [TEST-HUB-LED-RAIL-001]

  HUB-3V3-RIPPLE:
    description: Peak-to-peak switching ripple on the 3.3 V rail.
    requirement_ids: [POWER-CHARGE-003]
    unit: V
    limits: {maximum: 0.05}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/ESP32-C6-MINI-1U-N4_C7558096.pdf, locator: "Recommended Operating Conditions, VDD33 power supply voltage 3.0 to 3.6 V"}
    operating_conditions: Loads from 0.2 to 2.0 A, 4.5 to 5.5 V module output, inductance over its 20 percent tolerance, and output capacitance at nominal and at half of nominal.
    margin: The rail regulates to 3.27 to 3.33 V, leaving 270 mV to the MCU's 3.6 V ceiling. A 50 mV ripple budget spends under a fifth of that and leaves the rest for the load transients this open-loop bench does not cover.
    test_ids: [TEST-HUB-3V3-001]

  HUB-3V3-INDUCTOR-PEAK:
    description: Peak inductor current in the 3.3 V converter.
    requirement_ids: [POWER-CHARGE-003]
    unit: A
    limits: {maximum: 2.5}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP63203WU-7_C780769.pdf, locator: "Electrical Characteristics, IPEAK_LIMIT high-side peak current limit, 2.5 A minimum"}
    operating_conditions: Loads from 0.2 to 2.0 A, 4.5 to 5.5 V module output, inductance over its 20 percent tolerance.
    margin: The converter's own guaranteed-lowest peak current limit binds before the inductor's 4.97 A saturation does, so this is the tighter of the two. Reaching it at a legitimate load would make the converter current-limit in normal operation.
    test_ids: [TEST-HUB-3V3-001]

  HUB-3V3-INDUCTOR-RMS:
    description: RMS inductor current in the 3.3 V converter.
    requirement_ids: [POWER-CHARGE-003]
    unit: A
    limits: {maximum: 3.3}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/NR6045S4R7MT_C42370396.pdf, locator: "Rated current: Isat or Irms, whichever is smaller; Irms 3.30 A"}
    operating_conditions: Loads from 0.2 to 2.0 A, 4.5 to 5.5 V module output, inductance over its 20 percent tolerance.
    margin: Irms is the smaller of the part's two ratings and therefore its rated current. The heating this measures is the inductor's own, not the converter's junction temperature, which V8 measures.
    test_ids: [TEST-HUB-3V3-001]

  HUB-CHARGE-SWITCH-DROP:
    description: Conduction drop across the gated USB input switch at full source current.
    requirement_ids: [POWER-CHARGE-003]
    unit: V
    limits: {maximum: 0.15}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP22811AW5-7_C3001660.pdf, locator: "Electrical Characteristics, RDS(ON) switch on-resistance, 65 mOhm maximum at VIN = 5 V"}
    operating_conditions: The 2 A a compliant 5 V USB source delivers, at the switch's maximum on-resistance.
    margin: Derived rather than simulated, because the switch is a resistor with a limit and its steady state is arithmetic on data sheet values. What needs simulating is the transient, which is blocked on binding a module whose input capacitance sets the inrush.
    test_ids: [TEST-HUB-CHARGE-PATH-001]

  HUB-CHARGE-SWITCH-LIMIT-FLOOR:
    description: Guaranteed minimum current limit of the gated USB input switch.
    requirement_ids: [POWER-CHARGE-003]
    unit: A
    limits: {minimum: 2.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP22811AW5-7_C3001660.pdf, locator: "Electrical Characteristics, ILIMIT over load current limit, 2.2 A minimum"}
    operating_conditions: Charge current and system load together, from a compliant 5 V 2 A source.
    margin: The protection must never fire on a legitimate load. Its 2.2 A floor clears the 2 A a compliant source can deliver by 10 percent, deliberately tight, because the pairing means the switch limits at about the point the adapter itself runs out.
    test_ids: [TEST-HUB-CHARGE-PATH-001]

  HUB-3V3-DROPOUT-INPUT:
    description: Lowest power-module output that still holds the 3.3 V rail in regulation.
    requirement_ids: [POWER-CHARGE-003]
    unit: V
    limits: {maximum: 4.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP63203WU-7_C780769.pdf, locator: "Electrical Characteristics, RDS(ON)1 high-side switch on-resistance 125 mOhm, with the inductor's 34 mOhm from its own data sheet"}
    operating_conditions: The rounded-up 1.34 A coincident 3.3 V rail load, with the converter in dropout holding its high-side switch on; the 5 V light bars do not cross this buck.
    margin: Derived, because in dropout the converter stops switching and the path is two resistances. The 3.51 V result is what sets the minimum output the interface may accept from a module, and the 4.0 V limit keeps half a volt in hand for cable and connector drops that are not in this figure.
    test_ids: [TEST-HUB-3V3-002]

  HUB-3V3-STARTUP-INRUSH:
    description: Current the 3.3 V output capacitors draw during the converter's soft start.
    requirement_ids: [POWER-CHARGE-003]
    unit: A
    limits: {maximum: 0.2}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/AP63203WU-7_C780769.pdf, locator: "Electrical Characteristics, tSS soft-start period 4 ms"}
    operating_conditions: Both 22 uF output capacitors charged from zero to 3.3 V over the soft-start period.
    margin: The 4 ms ramp is what makes cold start uneventful. At 36 mA the capacitor charge is a twentieth of the converter's rating and disappears into the load, so startup needs no inrush limiting of its own.
    test_ids: [TEST-HUB-3V3-002]

  HUB-MODULE-LOAD-BUDGET:
    description: Coincident worst-case current the hub draws from its power module.
    requirement_ids: [POWER-CHARGE-003]
    unit: A
    limits: {maximum: 1.6}
    evidence: {class: Derived, source: docs/hardware/power-module-interface.md, locator: "Mandatory properties, 5 V output at 1.6 A continuous"}
    operating_conditions: Radio transmitting at its data sheet peak, reader driving its field at maximum TVDD, both light bars white, matrix biased, and both displays active, all at once.
    margin: The manufacturer display table raises the coincident load to 1.48 A. The 1.6 A interface obligation leaves 8 percent, but the fitted TPS61023 cannot prove that load at its guaranteed minimum current limit, so the custom power board remains blocked pending a converter change.
    test_ids: [TEST-HUB-LOAD-BUDGET-001]

  MATRIX-BIAS-CHOKE-RATING:
    description: Selected-cell bias current against the bias choke's maximum rated current.
    requirement_ids: [PHY-RF-001]
    unit: mA
    limits: {maximum: 15.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/SDFL2012S100KTF_C1046.pdf, locator: "Selection table, SDFL2012S100 row, Max. Rated Ir 15 mA"}
    operating_conditions: Selected cell, 3.27 to 3.33 V rail from the buck's own regulation band, setting resistor at both extremes of its 1 percent tolerance.
    margin: This is the component's absolute maximum, distinct from the 7 to 14 mA band the design aims for. The swept worst case is 10.58 mA, leaving 29 percent, which settles the question of whether the 14 mA end of that band could ever be reached in practice.
    test_ids: [TEST-MATRIX-BIAS-003]

  LB-DATA-PULSE-DISTORTION:
    description: Pulse-width distortion of the light-bar data line between hub buffer and first pixel.
    requirement_ids: [IF-LIGHTBAR-002]
    unit: ns
    limits: {maximum: 50.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/T37K3RGB-05C000112U1930_DIGIKEY-3147-T37K3RGB-05C000112U1930CT-ND.pdf, locator: "Data transfer time, T0H zero-code high-level time 250 to 350 ns around a 300 ns nominal"}
    operating_conditions: Buffer at its data sheet 8 mA drive into the pixel's 30 pF maximum input, board traces, and a cable capacitance bounded at 150 pF.
    margin: A uniform delay shifts both edges alike and does not threaten a self-clocked line. What does is the buffer sourcing through about three times the impedance it sinks through, and that asymmetry comes to 15 ns at the cable bound, under a third of the symbol tolerance.
    test_ids: [TEST-LB-SIGNAL-001]

  HUB-I2C-RISE-TIME:
    description: Rise time of the hub's I2C bus through its pull-ups.
    requirement_ids: [IF-BUTTON-001]
    unit: ns
    limits: {maximum: 1000.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/TCA9535PWR_C130204.pdf, locator: "I2C timing, standard-mode rise time 1000 ns maximum"}
    operating_conditions: 4.7 kohm pull-ups to 3.3 V against a bus capacitance bounded at the I2C specification's own 200 pF ceiling.
    margin: 796 ns at that ceiling leaves a fifth of standard mode. It does not leave fast mode, which needs under 300 ns and so under about 70 pF of bus, so the bus is a standard-mode bus and firmware must not raise it.
    test_ids: [TEST-HUB-I2C-001]

  MATRIX-SERIAL-TRANSITION-RATE:
    description: Edge rate the matrix shift registers see on the hub's serial link.
    requirement_ids: [PHY-RF-001]
    unit: ns/V
    limits: {maximum: 139.0}
    evidence: {class: Datasheet, source: Vault/Scacchiera/Datasheets/74HC595D-118_C5947.pdf, locator: "Dynamic characteristics, input transition rise and fall rate, 139 ns/V at VCC 4.5 V"}
    operating_conditions: MCU driving at its 28 mA sink capability into two register inputs, board traces, and a cable capacitance bounded at 150 pF.
    margin: 16.4 ns/V leaves more than eight times the limit. The registers run at 3.3 V, where the same table allows a slower edge still, so quoting the 4.5 V row keeps the check conservative.
    test_ids: [TEST-MATRIX-SERIAL-001]
