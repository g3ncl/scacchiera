version: 1
reviewed_on: 2026-08-02
gate: V2

reviewed_erc_warning_classes:
  endpoint_off_grid:
    reason: SKiDL places electrically joined endpoints between the display grid points used by KiCad.
    disposition: Connectivity is verified by the generated netlist and PCB schematic parity.
  lib_symbol_mismatch:
    reason: SKiDL embeds project-specific symbol instances derived from the KiCad library originals.
    disposition: Pin identity is verified against the V1 audit and generated netlist.
  lib_symbol_issues:
    reason: KiCad's standalone CLI does not load project symbol tables without a native project file.
    disposition: The embedded symbols are V1-audited and their PCB connectivity is checked by parity.
  footprint_link_issues:
    reason: KiCad's standalone CLI does not load project footprint tables without a native project file.
    disposition: V1 audits exact footprint pads and PCB schematic parity verifies every resulting link.

no_connects:
  J1:
    pins: [A6, A7, A8, B6, B7, B8]
    datasheet: Vault/Scacchiera/Datasheets/USB4105-GF-A_C3020560.pdf
    locator: USB Type-C pin assignment; D+, D-, SBU1 and SBU2 are unused by the power-only sink.
  J3:
    pins: ['8']
    datasheet: Vault/Scacchiera/Datasheets/430450800_C122422.md
    locator: Eight-position header pin numbering; pin 8 is the reserved module-contract position.
  J8:
    pins: ['4']
    datasheet: Vault/Scacchiera/Datasheets/A1257WR-S-4P_C225127.pdf
    locator: Four-position connector pin assignment; DATA_OUT is deliberately open at the final bar.
  U3:
    pins: ['2', '11', '14', '20', '23', '24', '31', '32', '33', '34', '35', '40']
    datasheet: Vault/Scacchiera/Datasheets/PN5180A0HN-C3E_C1526287.pdf
    locator: HVQFN40 pin description, pins marked DNC or unused optional interfaces.
  U4:
    pins: ['4', '7', '10', '15', '17', '18', '20', '21', '32', '33', '34', '35']
    datasheet: Vault/Scacchiera/Datasheets/ESP32-C6-MINI-1U-N4_C7558096.pdf
    locator: Table 3-1 pin definitions; reserved pins, two unused GPIOs, and unused native USB pins. IO0 and IO1 are fitted as the CC voltage ADC inputs, with IO7 and IO14 carrying the displaced digital signals.
  U6:
    pins: ['1', '13', '14', '15', '18', '19', '20']
    datasheet: Vault/Scacchiera/Datasheets/TCA9535PWR_C130204.pdf
    locator: PW package pin functions; interrupt and four unused GPIOs.

matrix_no_connects:
  U2:
    pins: ['9']
    datasheet: Vault/Scacchiera/Datasheets/74HC595D-118_C5947.pdf
    locator: SO16 pin 9 Q7S serial output; deliberately open at the end of the register chain.

quad_no_connects:
  U1:
    pins: ['4', '5', '6', '7']
    datasheet: Vault/Scacchiera/Datasheets/74HC595D-118_C5947.pdf
    locator: >-
      SO16 pins 4 to 7, outputs Q4 to Q7. A board carries four lanes and the register has eight
      outputs, so half of it is deliberately unused. The waste is bought knowingly, because the
      part is Basic at 0.20 EUR and the alternative is eight lanes per board and a 280 mm outline
      back inside the fabricator's size charges. Q7S on pin 9 is used here, unlike the matrix,
      because every board chains into the next.

power_no_connects:
  U1:
    pins: ['2', '3', '4', '7', '12']
    datasheet: Vault/Scacchiera/Datasheets/BQ25895RTWR_C80200.pdf
    locator: RTW pin table; D+ and D- are absent at the module boundary, STAT and INT are unused status outputs, and QON may remain at its internal pullup.
  U2:
    pins: ['13']
    datasheet: Vault/Scacchiera/Datasheets/TPS61088RHLR_C87357.pdf
    locator: RHL pin table; floating MODE selects PFM operation at light load.
  J2:
    pins: ['8']
    datasheet: Vault/Scacchiera/Datasheets/430450800_C122422.md
    locator: Eight-position header pin numbering; pin 8 is reserved by the module contract.

