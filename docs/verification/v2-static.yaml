quad_layout:
  envelope_mm: [300, 140]
  copper_layers: 2
  board_thickness_mm: 0.6
  reviewed_route: hardware/pcb/routes/quad.ses
  rationale: The sensing plane that ships. Four identical boards of four lanes replace one
    300 x 300 mm monolith, on the 2026-08-02 quote; the matrix entry above is the retained
    baseline, not a second option.
  antenna_keepout: No track or via crosses the 276 mm of loop copper. Enforced as a board rule
    rather than left to the router, so the four loops cannot acquire a crossing on a reroute.
  assembly_side: Loops on F.Cu, all 52 fitted components on B.Cu, so the top face stays flat
    against the controlled air gap.
  fabrication_tier: 0.200 mm minimum track, 0.300 mm minimum drill, 0.600 mm minimum via pad, the
    same standard tier as the lightbar, hub and power boards. The matrix's 0.200/0.400 vias were
    the tightest geometry in the product and left with it.

power_layout:
  envelope_mm: [90, 32]
  copper_layers: 2
  reviewed_route: hardware/pcb/routes/power.ses
  reverse_cell_stage: J3 CELL_POS reaches only Q1 drains and the divided comparator sense; Q1 sources feed protected BAT_RAW, and U4 plus D1 have exact pin-level connectivity assertions.
  custom_rule: The 0.15 mm clearance applies only between Q1 pads, matching TI's DQG manufacturer land pattern; every other copper pair retains the board-wide 0.2 mm rule.

hub_layout:
  envelope_mm: [162, 46]
  copper_layers: 2
  board_thickness_mm: 1.0
  reviewed_route: hardware/pcb/routes/hub.ses
  rationale: Two copper layers at every board, bought with length rather than layers. The service volume is a 310 mm player rail containing only the hub, so 162 x 46 mm costs nothing mechanically and a four-layer panel costs multiples of a two-layer one.
  placement_method: Functional zones slide right by fixed amounts so the crossings between clusters open while the geometry inside a cluster is untouched.
  deterministic_routes:
  - USB shield tabs and bleed network
  - filtered CC1 and CC2 source-current sensing
  - 0.5 mm USB VBUS entry, safety-window distribution, and reference branch
  rf_ground_reserve:
    layer: B.Cu
    region_mm: {x_min: 122.0, x_max: 156.0, y_min: 10.0, y_max: 40.0}
    rule: No tracks, vias permitted.
    reason: The reader's match and the run to the matrix connector return through this copper at 13.56 MHz, so it stays a plane instead of whatever the router leaves between traces. It starts clear of the reader itself, whose QFN-40 needs both faces to escape.
    measured_signal_segments_inside: 0
  back_copper_use: 307 non-ground segments on B.Cu outside the reserve, against 557 on F.Cu.
  fabrication_layers: Read from the board's own layer table by hardware/pcb/fab.py, so a board that changes layer count cannot ship a Gerber set missing copper.

commands:
  static_gate: make check
  fresh_autoroute_quad: make pcb-quad-reroute
  fresh_autoroute_matrix: make pcb-matrix-reroute
  fresh_autoroute_hub: make pcb-hub-reroute
  fresh_autoroute_power: make pcb-power-reroute
evidence:
  hub_drc_command: make pcb-hub-drc
  static_tests: 18 focused connectivity and Type-C tests passed on 2026-07-29, including both CC orientations, the on-board battery measurement, exact reverse-cell pin maps, and the recorded two-layer stackup and envelope
