version: 1
reviewed_on: 2026-07-29
gate: V2

reviewed_erc_warning_classes:
  endpoint_off_grid:
    reason: SKiDL places electrically joined endpoints between the display grid points used by KiCad.
    disposition: Connectivity is verified by the generated netlist and PCB schematic parity.
  lib_symbol_mismatch:
    reason: SKiDL embeds project-specific symbol instances derived from the KiCad library originals.
    disposition: Pin identity is verified against the V1 audit and generated netlist.
  lib_symbol_issues:
    reason: KiCad's standalone CLI does not load project symbol tables without a native project file.
    disposition: The embedded symbols are V1-audited and their PCB connectivity is checked by parity.
  footprint_link_issues:
    reason: KiCad's standalone CLI does not load project footprint tables without a native project file.
    disposition: V1 audits exact footprint pads and PCB schematic parity verifies every resulting link.

