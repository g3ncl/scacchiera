hub_layout:
  envelope_mm: [162, 46]
  copper_layers: 2
  board_thickness_mm: 1.0
  reviewed_route: hardware/pcb/routes/hub.ses
  rationale: Two copper layers at every board, bought with length rather than layers. The service volume is a 310 mm player rail containing only the hub, so 162 x 46 mm costs nothing mechanically and a four-layer panel costs multiples of a two-layer one.
  placement_method: Functional zones slide right by fixed amounts so the crossings between clusters open while the geometry inside a cluster is untouched.
  deterministic_routes:
  - USB shield tabs and bleed network
  - 0.5 mm USB VBUS entry, safety-window distribution, and reference branch
  rf_ground_reserve:
    layer: B.Cu
    region_mm: {x_min: 122.0, x_max: 156.0, y_min: 10.0, y_max: 40.0}
    rule: No tracks, vias permitted.
    reason: The reader's match and the run to the matrix connector return through this copper at 13.56 MHz, so it stays a plane instead of whatever the router leaves between traces. It starts clear of the reader itself, whose QFN-40 needs both faces to escape.
    measured_signal_segments_inside: 0
  back_copper_use: 256 non-ground segments on B.Cu outside the reserve, against 819 on F.Cu.
  fabrication_layers: Read from the board's own layer table by hardware/pcb/fab.py, so a board that changes layer count cannot ship a Gerber set missing copper.

